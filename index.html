<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun ke-25 Galinasari 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0b2e, #2e1a47, #4a2b6b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Bintang & partikel */
        .stars, .twinkling, .confetti {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
            pointer-events: none;
            z-index: 1;
        }

        .stars {
            background: transparent url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MDAiIGhlaWdodD0iNTAwIj48Y2lyY2xlIGN4PSIxMCIgY3k9IjEwIiByPSIxIiBmaWxsPSJ3aGl0ZSIgb3BhY2l0eT0iMC44Ii8+PGNpcmNsZSBjeD0iMjUwIiBjeT0iMTUwIiByPSIxLjUiIGZpbGw9IndoaXRlIiBvcGFjaXR5PSIwLjYiLz48Y2lyY2xlIGN4PSI0MDAiIGN5PSI4MCIgcj0iMSIgZmlsbD0id2hpdGUiIG9wYWNpdHk9IjAuNyIvPjxjaXJjbGUgY3g9IjE1MCIgY3k9IjMwMCIgcj0iMS4yIiBmaWxsPSJ3aGl0ZSIgb3BhY2l0eT0iMC41Ii8+PGNpcmNsZSBjeD0iMzUwIiBjeT0iNDAwIiByPSIxLjgiIGZpbGw9IndoaXRlIiBvcGFjaXR5PSIwLjYiLz48Y2lyY2xlIGN4PSI4MCIgY3k9IjQ1MCIgcj0iMSIgZmlsbD0id2hpdGUiIG9wYWNpdHk9IjAuNyIvPjxjaXJjbGUgY3g9IjQ1MCIgY3k9IjI1MCIgcj0iMS4zIiBmaWxsPSJ3aGl0ZSIgb3BhY2l0eT0iMC41Ii8+PC9zdmc+') repeat;
            background-size: 500px 500px;
            animation: starMove 120s linear infinite;
            opacity: 0.9;
        }

        @keyframes starMove {
            from { transform: translateY(0); }
            to { transform: translateY(-500px); }
        }

        .twinkling {
            background: transparent url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MDAiIGhlaWdodD0iNTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSIxLjUiIGZpbGw9IiNmZmZmY2MiIG9wYWNpdHk9IjAuOCIvPjxjaXJjbGUgY3g9IjIwMCIgY3k9IjEwMCIgcj0iMiIgZmlsbD0iI2ZmZmZjYyIgb3BhY2l0eT0iMC42Ii8+PGNpcmNsZSBjeD0iNDUwIiBjeT0iMjAwIiByPSIxLjgiIGZpbGw9IiNmZmZmY2MiIG9wYWNpdHk9IjAuNyIvPjxjaXJjbGUgY3g9IjMwMCIgY3k9IjM1MCIgcj0iMi4yIiBmaWxsPSIjZmZmZmNjIiBvcGFjaXR5PSIwLjUiLz48Y2lyY2xlIGN4PSIxMjAiIGN5PSI0MjAiIHI9IjEuNiIgZmlsbD0iI2ZmZmZjYyIgb3BhY2l0eT0iMC42Ii8+PC9zdmc+') repeat;
            background-size: 500px 500px;
            animation: twinkle 4s ease-in-out infinite alternate;
            z-index: 2;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .confetti { z-index: 3; overflow: hidden; }

        .confetti-piece {
            position: absolute;
            width: 12px; height: 12px;
            background: #f2d74e;
            top: -20px;
            opacity: 0.8;
            animation: fall linear infinite;
            border-radius: 2px;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* Kartu utama */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 40px;
            padding: 2.5rem 2rem;
            max-width: 650px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 215, 0, 0.2) inset, 0 0 40px rgba(255, 200, 0, 0.3);
            animation: cardAppear 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, floatCard 6s ease-in-out infinite 1.5s;
            max-height: 95vh;
            overflow-y: auto;
        }

        .card::-webkit-scrollbar { width: 6px; }
        .card::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .card::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.5); border-radius: 10px; }

        @keyframes cardAppear {
            0% { opacity: 0; transform: scale(0.3) rotate(-10deg); }
            60% { opacity: 1; transform: scale(1.05) rotate(2deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(0.5deg); }
        }

        /* Foto Galinasari */
        .photo-frame {
            width: 160px;
            height: 160px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, #FFD700, #FF69B4, #FFD700);
            animation: photoSpin 6s linear infinite, photoPop 1s ease-out 0.5s both;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.7);
            position: relative;
        }

        @keyframes photoSpin {
            0% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.7), 0 0 60px rgba(255, 105, 180, 0.5); }
            50% { box-shadow: 0 0 30px rgba(255, 105, 180, 0.7), 0 0 60px rgba(255, 215, 0, 0.5); }
            100% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.7), 0 0 60px rgba(255, 105, 180, 0.5); }
        }

        @keyframes photoPop {
            0% { opacity: 0; transform: scale(0); }
            70% { transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 3px solid #1a0b2e;
            animation: photoFloat 4s ease-in-out infinite;
        }

        @keyframes photoFloat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .cake-icon {
            font-size: 3.5rem;
            line-height: 1;
            margin-bottom: 0.3rem;
            animation: bounceCake 2s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.7));
        }

        @keyframes bounceCake {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.1); }
        }

        .title {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            color: #FFD966;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 200, 0, 0.4), 3px 3px 0 #7a4b00;
            letter-spacing: 2px;
            margin-bottom: 0.3rem;
            animation: glowTitle 2s ease-in-out infinite alternate, slideDown 1s ease-out 0.3s both;
        }

        @keyframes glowTitle {
            from { text-shadow: 0 0 20px #FFD966, 0 0 40px #FFB347, 3px 3px 0 #7a4b00; }
            to { text-shadow: 0 0 30px #FFE066, 0 0 70px #FFA500, 0 0 90px #FFD700, 3px 3px 0 #7a4b00; }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .age {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #FFD700, #FFB347, #FF8C00);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0.2rem 0 0.5rem 0;
            animation: pulseAge 1.5s ease-in-out infinite alternate, slideDown 1s ease-out 0.6s both;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
        }

        @keyframes pulseAge {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .name {
            font-family: 'Pacifico', cursive;
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 10px #FF69B4, 0 0 30px #FF1493, 0 0 50px #FF69B4;
            margin: 0.3rem 0 0.8rem 0;
            animation: slideDown 1s ease-out 0.9s both, nameGlow 2s infinite alternate;
            letter-spacing: 2px;
        }

        @keyframes nameGlow {
            from { text-shadow: 0 0 10px #FF69B4, 0 0 30px #FF1493, 0 0 50px #FF69B4; }
            to { text-shadow: 0 0 20px #FFB6C1, 0 0 50px #FF69B4, 0 0 80px #FF1493; }
        }

        .message {
            font-size: 1.05rem;
            color: #f0e6ff;
            line-height: 1.7;
            margin: 1rem 0 1.5rem 0;
            font-weight: 600;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
            animation: slideDown 1s ease-out 1.2s both;
            padding: 0 0.5rem;
        }

        .divider {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 0.8rem 0;
            animation: slideDown 1s ease-out 1.5s both;
        }

        .divider .line {
            height: 2px;
            width: 60px;
            background: linear-gradient(90deg, transparent, #FFD700, #FFB347, #FFD700, transparent);
            border-radius: 2px;
        }

        .divider .heart {
            font-size: 1.5rem;
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.3); }
            50% { transform: scale(1.1); }
            70% { transform: scale(1.25); }
        }

        .balloon-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            width: 50px;
            height: 65px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset -5px -5px 15px rgba(0,0,0,0.2), inset 5px 5px 15px rgba(255,255,255,0.4);
            animation: floatBalloon 8s ease-in-out infinite;
            opacity: 0.8;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -8px; left: 50%;
            transform: translateX(-50%);
            width: 2px; height: 40px;
            background: rgba(255,255,255,0.6);
        }

        @keyframes floatBalloon {
            0% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
            100% { transform: translateY(0) rotate(-5deg); }
        }

        /* Tombol */
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
            animation: slideDown 1s ease-out 1.8s both;
        }

        .wish-btn {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            border: none;
            border-radius: 50px;
            color: #2e1a47;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 165, 0, 0.4), 0 0 0 2px rgba(255, 215, 0, 0.3) inset;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: btnPulse 2s infinite;
        }

        .wish-btn:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 165, 0, 0.6), 0 0 0 3px rgba(255, 215, 0, 0.6) inset;
        }

        .wish-btn:active { transform: scale(0.98); }

        .wish-btn:disabled {
            cursor: default;
            animation: none;
            opacity: 0.9;
        }

        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 10px 20px rgba(255, 165, 0, 0.4), 0 0 0 2px rgba(255, 215, 0, 0.3) inset; }
            50% { box-shadow: 0 10px 30px rgba(255, 215, 0, 0.8), 0 0 0 4px rgba(255, 215, 0, 0.6) inset; }
        }

        .music-btn {
            background: linear-gradient(45deg, #9370DB, #FF69B4);
            color: #fff;
        }

        .glow-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 110%; height: 110%;
            border-radius: 50%;
            border: 2px solid rgba(255, 215, 0, 0.3);
            animation: ringRotate 20s linear infinite;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes ringRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Overlay "tap to start" untuk autoplay */
        .tap-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(26, 11, 46, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            text-align: center;
            padding: 20px;
        }

        .tap-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .tap-overlay .gift-icon {
            font-size: 6rem;
            animation: bounceCake 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 30px gold);
            margin-bottom: 1rem;
        }

        .tap-overlay h2 {
            font-family: 'Pacifico', cursive;
            color: #FFD966;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        .tap-overlay p {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            animation: pulseAge 1.5s ease-in-out infinite alternate;
        }

        @media (max-width: 600px) {
            .card { padding: 2rem 1rem; border-radius: 25px; }
            .title { font-size: 1.9rem; }
            .name { font-size: 2.2rem; }
            .age { font-size: 1.7rem; }
            .message { font-size: 0.95rem; }
            .cake-icon { font-size: 2.5rem; }
            .photo-frame { width: 120px; height: 120px; }
            .balloon { width: 35px; height: 45px; }
            .wish-btn { padding: 10px 18px; font-size: 0.85rem; }
            .tap-overlay .gift-icon { font-size: 4rem; }
            .tap-overlay h2 { font-size: 1.5rem; }
            .tap-overlay p { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <!-- Overlay "tap to start" — ini trick utama biar lagu otomatis nyala -->
    <div class="tap-overlay" id="tapOverlay">
        <div class="gift-icon">🎁</div>
        <h2>Kejutan Untuk Galinasari</h2>
        <p>👆 Ketuk di mana saja untuk membuka 🎵</p>
    </div>

    <div class="stars"></div>
    <div class="twinkling"></div>
    <div class="confetti" id="confetti"></div>
    <div class="balloon-container" id="balloons"></div>

    <!-- Audio dengan autoplay + preload -->
    <audio id="laguUlangTahun" loop preload="auto" autoplay playsinline>
        <source src="lagu_ultah_india.mp3" type="audio/mpeg">
        <source src="https://raw.githubusercontent.com/rikanami/ultah/main/lagu_ultah_india.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <div class="card">
        <div class="glow-ring"></div>

        <div class="photo-frame">
            <img src="galinasari.jpg" alt="Galinasari"
                 onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/rikanami/ultah/main/galinasari.jpg';">
        </div>

        <div class="cake-icon">🎂</div>
        <div class="title">Selamat Ulang Tahun</div>
        <div class="age">ke-25</div>
        <div class="name">Galinasari</div>

        <div class="divider">
            <span class="line"></span>
            <span class="heart">💖</span>
            <span class="line"></span>
        </div>

        <div class="message">
            ✨ Semoga di usia yang ke-25 ini,<br>
            setiap langkahmu dipenuhi kebahagiaan,<br>
            kesehatan, dan kesuksesan yang tak terbatas.<br>
            Terus bersinar seperti bintang, Galinasari! 🌟
        </div>

        <div class="button-group">
            <button class="wish-btn music-btn" id="musicBtn">⏸️ Jeda Lagu</button>
            <button class="wish-btn" id="wishBtn">Kirim Doa 💌</button>
        </div>
    </div>

    <script>
        // ============ CONFETTI ============
        (function createConfetti() {
            const container = document.getElementById('confetti');
            const colors = ['#FFD700', '#FF69B4', '#FF4500', '#00CED1', '#9370DB', '#FFB347', '#FF1493', '#7FFF00', '#FF6347'];
            for (let i = 0; i < 80; i++) {
                const p = document.createElement('div');
                p.classList.add('confetti-piece');
                const size = Math.random() * 10 + 5;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.animationDuration = (Math.random() * 4 + 4) + 's';
                p.style.animationDelay = (Math.random() * 8) + 's';
                p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                p.style.opacity = Math.random() * 0.6 + 0.4;
                container.appendChild(p);
            }
        })();

        // ============ BALON ============
        (function createBalloons() {
            const container = document.getElementById('balloons');
            const colors = [
                'radial-gradient(circle at 30% 30%, #ff99cc, #ff3399)',
                'radial-gradient(circle at 30% 30%, #99ccff, #3399ff)',
                'radial-gradient(circle at 30% 30%, #ffff99, #ffcc00)',
                'radial-gradient(circle at 30% 30%, #99ff99, #33cc33)',
                'radial-gradient(circle at 30% 30%, #ffb3b3, #ff6666)',
                'radial-gradient(circle at 30% 30%, #d9b3ff, #994dff)',
                'radial-gradient(circle at 30% 30%, #ffcc99, #ff9933)'
            ];
            for (let i = 0; i < 12; i++) {
                const b = document.createElement('div');
                b.classList.add('balloon');
                const sizeVar = Math.random() * 30 + 35;
                b.style.width = sizeVar + 'px';
                b.style.height = (sizeVar * 1.3) + 'px';
                b.style.left = (Math.random() * 95) + '%';
                b.style.top = (Math.random() * 80 + 10) + '%';
                b.style.background = colors[Math.floor(Math.random() * colors.length)];
                b.style.animationDuration = (Math.random() * 6 + 6) + 's';
                b.style.animationDelay = (Math.random() * 5) + 's';
                b.style.opacity = Math.random() * 0.4 + 0.4;
                container.appendChild(b);
            }
        })();

        // ============ AUTOPLAY MUSIK (MULTI-LAYER) ============
        const lagu = document.getElementById('laguUlangTahun');
        const musicBtn = document.getElementById('musicBtn');
        const tapOverlay = document.getElementById('tapOverlay');

        lagu.volume = 0.7;

        // Fungsi putar lagu
        function putarLagu() {
            const playPromise = lagu.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    musicBtn.textContent = '⏸️ Jeda Lagu';
                }).catch(err => {
                    console.log('Autoplay diblokir:', err);
                    musicBtn.textContent = '🎵 Putar Lagu';
                });
            }
        }

        // LAYER 1: Coba autoplay langsung saat load
        window.addEventListener('load', function() {
            putarLagu();
        });

        // LAYER 2: Coba autoplay begitu user menyentuh/klik di mana saja
        // Sekaligus tutup overlay "tap to start"
        function startEverything() {
            putarLagu();
            tapOverlay.classList.add('hidden');
            // Lepas semua event listener setelah dipicu
            document.removeEventListener('click', startEverything);
            document.removeEventListener('touchstart', startEverything);
            document.removeEventListener('keydown', startEverything);
            document.removeEventListener('scroll', startEverything);
            document.removeEventListener('mousemove', startEverything);
        }

        document.addEventListener('click', startEverything);
        document.addEventListener('touchstart', startEverything);
        document.addEventListener('keydown', startEverything);
        document.addEventListener('scroll', startEverything);
        document.addEventListener('mousemove', startEverything);

        // LAYER 3: Fallback — kalau setelah 1 detik masih belum play, tampilkan overlay hint
        setTimeout(() => {
            if (lagu.paused) {
                musicBtn.textContent = '🎵 Putar Lagu';
                // Overlay tetap ada, biar user tahu harus tap
            } else {
                tapOverlay.classList.add('hidden');
            }
        }, 1500);

        // Toggle musik via tombol
        musicBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (lagu.paused) {
                lagu.play();
                musicBtn.textContent = '⏸️ Jeda Lagu';
            } else {
                lagu.pause();
                musicBtn.textContent = '🎵 Putar Lagu';
            }
        });

        // ============ TOMBOL KIRIM DOA ============
        const wishBtn = document.getElementById('wishBtn');
        wishBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            const colors = ['#FFD700', '#FF69B4', '#FF4500', '#00CED1', '#9370DB', '#FF1493'];
            for (let i = 0; i < 30; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.position = 'fixed';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = Math.random() * 100 + 'vh';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                heart.style.pointerEvents = 'none';
                heart.style.zIndex = '9999';
                heart.style.animation = `fall ${Math.random() * 2 + 2}s linear forwards`;
                heart.style.opacity = '1';
                heart.style.filter = `drop-shadow(0 0 10px ${colors[Math.floor(Math.random() * colors.length)]})`;
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }

            wishBtn.textContent = 'Doa Terkirim! 🎉';
            wishBtn.disabled = true;
            setTimeout(() => {
                wishBtn.textContent = 'Terima Kasih Galinasari! 💖';
            }, 2000);
        });

        // Fallback untuk gambar: kalau path lokal gagal, pakai URL raw GitHub
        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('error', function() {
                if (!this.dataset.fallbackApplied) {
                    this.dataset.fallbackApplied = 'true';
                    const filename = this.getAttribute('src').split('/').pop();
                    this.src = 'https://raw.githubusercontent.com/rikanami/ultah/main/' + filename;
                }
            });
        });
    </script>
</body>
</html>
